version: '3.7'

# Grafana + Prometheus, brought up only when capturing dashboard screenshots
# for the portfolio - not run persistently at this RAM tier.

services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
