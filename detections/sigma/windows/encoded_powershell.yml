
title: Suspicious Encoded PowerShell Command
id: 3f1a1b2c-0001-4e2a-9c1a-000000000001
status: experimental
description: Detects PowerShell invoked with -EncodedCommand, commonly used to obfuscate malicious commands
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\powershell.exe'
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
      - '-e '
  condition: selection
falsepositives:
  - Legitimate admin scripts using encoded commands (rare)
level: high
tags:
  - attack.t1059.001
  - attack.t1027
