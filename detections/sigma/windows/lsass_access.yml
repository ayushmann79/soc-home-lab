title: Potential Credential Dumping via LSASS Access
id: 3f1a1b2c-0003-4e2a-9c1a-000000000003
status: experimental
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
  condition: selection
falsepositives:
  - Legitimate security/AV tools reading LSASS memory
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
