
title: Sudo Privilege Escalation via Shell Spawn
id: 3f1a1b2c-0005-4e2a-9c1a-000000000005
status: experimental
logsource:
  product: linux
  service: auditd
detection:
  selection_sudo:
    type: 'EXECVE'
    a0: 'sudo'
  selection_bash:
    a1:
      - 'bash'
      - '/bin/bash'
  selection_sh:
    a1:
      - 'sh'
      - '/bin/sh'
  condition: selection_sudo and (selection_bash or selection_sh)
falsepositives:
  - Legitimate admin usage
level: medium
tags:
  - attack.t1548.003
